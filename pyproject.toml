[project]
name = "vbr-pulse"
dynamic = ["version"]
description = "Demo app that makes the Veeam Backup & Replication 13.1 REST API visible."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "jinja2>=3.1",
    "keyring>=25",
    "truststore>=0.10",
    "jsonschema>=4.23",
    "python-multipart>=0.0.32",
]

[project.scripts]
pulse = "pulse.cli:main"

[dependency-groups]
release = [
    "pyinstaller>=6.10",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "datamodel-code-generator[http]>=0.26",
    "types-jsonschema>=4.26.0.20260518",
    "playwright>=1.63.0",
    "axe-playwright-python>=0.1.8",
    "pytest-github-actions-annotate-failures>=0.4.2",
    "pillow>=12.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pulse/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pulse"]

[tool.hatch.build.targets.wheel.force-include]
"openapi/vbr-1.3-rev2.json" = "pulse/openapi/vbr-1.3-rev2.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "lab: runs against a real VBR lab server (opt-in with -m lab)",
    "e2e: drives a real browser against mock mode (opt-in with -m e2e)",
]
addopts = "-m 'not lab and not e2e'"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/pulse/vbr/models/generated.py", "src/pulse/vbr/operations.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = [
    "S101",    # assert is fine in tests
    "RUF001",  # UI copy uses typographic characters on purpose (–, ×, …)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # fake passwords in fixtures
"src/pulse/web/**" = ["S704"]  # every Markup() built here escapes its inputs first

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["pulse"]
exclude = ["src/pulse/vbr/models/generated\\.py$"]

[[tool.mypy.overrides]]
module = ["pulse.vbr.models.generated"]
ignore_errors = true
follow_imports = "skip"
